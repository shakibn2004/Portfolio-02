<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Launch Banner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      background: #060911;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    /* Background Ambient Glows & Grid */
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .glow-1 {
      position: absolute;
      top: -150px;
      left: 15%;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(0, 245, 160, 0.14) 0%, transparent 70%);
      pointer-events: none;
    }
    .glow-2 {
      position: absolute;
      bottom: -150px;
      right: 15%;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.14) 0%, transparent 70%);
      pointer-events: none;
    }
    
    /* Header Info */
    .banner-header {
      text-align: center;
      margin-bottom: 28px;
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 9999px;
      background: rgba(0, 245, 160, 0.1);
      border: 1px solid rgba(0, 245, 160, 0.3);
      color: #00f5a0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }
    .title {
      font-size: 52px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1.2px;
      margin-bottom: 8px;
    }
    .title span {
      background: linear-gradient(135deg, #00f5a0 0%, #3b82f6 50%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 19px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.5px;
    }
    
    /* Browser Window Frame */
    .browser-frame {
      width: 1560px;
      background: #0f172a;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 0 50px rgba(0, 245, 160, 0.12);
      overflow: hidden;
      z-index: 10;
    }
    .browser-top {
      height: 44px;
      background: #1e293b;
      display: flex;
      align-items: center;
      padding: 0 18px;
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .dots {
      display: flex;
      gap: 8px;
      position: absolute;
      left: 18px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }
    
    .url-bar {
      margin: 0 auto;
      width: 440px;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }
    .url-bar span { color: #00f5a0; margin-right: 6px; }
    
    .browser-body {
      width: 100%;
      overflow: hidden;
    }
    .browser-body img {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="grid-pattern"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="banner-header">
    <div class="badge">🚀 PORTFOLIO LAUNCH 2026</div>
    <h1 class="title">Md. Nazmus Shakib — <span>Full-Stack Engineer</span></h1>
    <div class="subtitle">React • Next.js • Node.js • TypeScript • MongoDB • Tailwind CSS</div>
  </div>

  <div class="browser-frame">
    <div class="browser-top">
      <div class="dots">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
      <div class="url-bar">
        <span>🔒</span> https://nazmus-shakib.space
      </div>
    </div>
    <div class="browser-body">
      <img src="portfolio_homepage_real.png" alt="Real Portfolio Screenshot">
    </div>
  </div>
</body>
</html>
